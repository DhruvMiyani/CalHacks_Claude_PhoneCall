<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeSync - Cyberpunk</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: 
                radial-gradient(circle at 25% 25%, #00a8ff 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, #e056fd 0%, transparent 50%),
                linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    rgba(0, 168, 255, 0.02) 1px,
                    transparent 2px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    rgba(224, 86, 253, 0.02) 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: 1;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00a8ff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 
                0 0 30px rgba(0, 168, 255, 0.3),
                inset 0 0 30px rgba(0, 168, 255, 0.05);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00a8ff, #e056fd, transparent);
            animation: scanline 3s ease-in-out infinite;
        }
        
        @keyframes scanline {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }
        
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00a8ff, #e056fd, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 168, 255, 0.5);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes titleGlow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.2); }
        }
        
        .form-group {
            margin-bottom: 28px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #00a8ff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 168, 255, 0.5);
        }
        
        input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid rgba(0, 168, 255, 0.3);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.4s ease;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            box-shadow: inset 0 0 20px rgba(0, 168, 255, 0.1);
        }
        
        input:focus {
            outline: none;
            border-color: #00a8ff;
            box-shadow: 
                0 0 25px rgba(0, 168, 255, 0.4),
                inset 0 0 25px rgba(0, 168, 255, 0.1);
            background: rgba(0, 168, 255, 0.05);
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #00a8ff, #e056fd);
            color: #fff;
            border: none;
            padding: 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Rajdhani', sans-serif;
            box-shadow: 
                0 0 20px rgba(0, 168, 255, 0.3),
                0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 0 30px rgba(0, 168, 255, 0.6),
                0 10px 25px rgba(0, 0, 0, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 32px;
            padding: 28px;
            background: rgba(224, 86, 253, 0.1);
            border: 1px solid #e056fd;
            border-radius: 12px;
            display: none;
            box-shadow: 
                0 0 25px rgba(224, 86, 253, 0.2),
                inset 0 0 25px rgba(224, 86, 253, 0.05);
        }
        
        .time-info {
            display: grid;
            gap: 20px;
        }
        
        .time-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 24px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            box-shadow: 
                0 0 15px rgba(0, 255, 255, 0.2),
                inset 0 0 15px rgba(0, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .time-box:hover {
            border-color: #00ffff;
            box-shadow: 
                0 0 25px rgba(0, 255, 255, 0.4),
                inset 0 0 25px rgba(0, 255, 255, 0.1);
        }
        
        .city-name {
            font-weight: 600;
            color: #00ffff;
            font-size: 1.2rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .time-display {
            font-size: 2.2rem;
            font-weight: 700;
            color: #e056fd;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(224, 86, 253, 0.5);
        }
        
        .timezone-info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .error {
            margin-top: 28px;
            padding: 20px;
            background: rgba(255, 0, 100, 0.15);
            border: 1px solid #ff0064;
            border-radius: 8px;
            color: #ff6b9d;
            display: none;
            box-shadow: 0 0 20px rgba(255, 0, 100, 0.2);
        }
        
        .loading {
            text-align: center;
            color: #00a8ff;
            margin-top: 24px;
            display: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes loadingPulse {
            0%, 100% { 
                opacity: 0.6;
                text-shadow: 0 0 5px rgba(0, 168, 255, 0.3);
            }
            50% { 
                opacity: 1;
                text-shadow: 0 0 15px rgba(0, 168, 255, 0.8);
            }
        }
        
        .example {
            margin-top: 28px;
            padding: 20px;
            background: rgba(0, 168, 255, 0.1);
            border: 1px solid rgba(0, 168, 255, 0.3);
            border-radius: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: inset 0 0 15px rgba(0, 168, 255, 0.1);
        }
        
        .glitch {
            position: relative;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .glitch::before {
            animation: glitch1 0.5s infinite;
            color: #00a8ff;
            z-index: -1;
        }
        
        .glitch::after {
            animation: glitch2 0.5s infinite;
            color: #e056fd;
            z-index: -2;
        }
        
        @keyframes glitch1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
        
        @keyframes glitch2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(2px, -2px); }
            40% { transform: translate(2px, 2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(-2px, 2px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="glitch" data-text="TIMESYNC">TIMESYNC</h1>
        
        <form id="timezoneForm">
            <div class="form-group">
                <label for="cityA">FROM LOCATION</label>
                <input type="text" id="cityA" name="cityA" placeholder="NEW YORK, LONDON, TOKYO..." required>
            </div>
            
            <div class="form-group">
                <label for="cityB">TO LOCATION</label>
                <input type="text" id="cityB" name="cityB" placeholder="LOS ANGELES, PARIS, SYDNEY..." required>
            </div>
            
            <div class="form-group">
                <label for="time">TIME OVERRIDE</label>
                <input type="time" id="time" name="time">
            </div>
            
            <button type="submit" id="convertBtn">SYNC TIMELINE</button>
        </form>
        
        <div class="loading" id="loading">SYNCING TIMELINE...</div>
        
        <div class="result" id="result">
            <div class="time-info">
                <div class="time-box">
                    <div class="city-name" id="cityAName"></div>
                    <div class="time-display" id="timeA"></div>
                    <div class="timezone-info" id="timezoneA"></div>
                </div>
                <div class="time-box">
                    <div class="city-name" id="cityBName"></div>
                    <div class="time-display" id="timeB"></div>
                    <div class="timezone-info" id="timezoneB"></div>
                </div>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="example">
            <strong>NEURAL NET EXAMPLES:</strong> "NEW YORK", "LONDON", "TOKYO"
        </div>
    </div>

    <script>
        document.getElementById('timezoneForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cityA = document.getElementById('cityA').value.trim();
            const cityB = document.getElementById('cityB').value.trim();
            const time = document.getElementById('time').value.trim();
            
            if (!cityA || !cityB) {
                showError('BOTH LOCATIONS REQUIRED FOR SYNC');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('convertBtn').disabled = true;
            
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city_a: cityA, city_b: cityB, time: time })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data);
                } else {
                    showError(data.error.toUpperCase() || 'SYNC ERROR DETECTED');
                }
            } catch (error) {
                showError('NETWORK BREACH: ' + error.message.toUpperCase());
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('convertBtn').disabled = false;
            }
        });
        
        function showResult(data) {
            document.getElementById('cityAName').textContent = data.city_a.toUpperCase();
            document.getElementById('cityBName').textContent = data.city_b.toUpperCase();
            document.getElementById('timeA').textContent = data.time_a.split(' ').slice(1, 2).join(' ');
            document.getElementById('timeB').textContent = data.time_b.split(' ').slice(1, 2).join(' ');
            document.getElementById('timezoneA').textContent = data.timezone_a + ' • ' + data.time_a.split(' ')[0];
            document.getElementById('timezoneB').textContent = data.timezone_b + ' • ' + data.time_b.split(' ')[0];
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
