<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeSync - Retro Neon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background: radial-gradient(ellipse at center, #1a0033 0%, #000 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 127, 0.03) 2px,
                rgba(0, 255, 127, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff7f;
            border-radius: 0;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 
                0 0 20px #00ff7f,
                inset 0 0 20px rgba(0, 255, 127, 0.1);
            position: relative;
            z-index: 2;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff7f, #ff1493, #00ff7f);
            border-radius: 0;
            z-index: -1;
            animation: borderGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes borderGlow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00ff7f, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ff7f;
            animation: titlePulse 3s ease-in-out infinite;
        }
        
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #00ff7f;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ff7f;
        }
        
        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #ff1493;
            border-radius: 0;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
        }
        
        input:focus {
            outline: none;
            border-color: #00ff7f;
            box-shadow: 0 0 20px #00ff7f;
            background: rgba(0, 255, 127, 0.1);
        }
        
        input::placeholder {
            color: #888;
        }
        
        button {
            width: 100%;
            background: linear-gradient(45deg, #00ff7f, #ff1493);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 0;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.5);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 30px rgba(0, 255, 127, 0.7);
            filter: brightness(1.2);
        }
        
        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 32px;
            padding: 24px;
            background: rgba(0, 255, 127, 0.1);
            border: 1px solid #00ff7f;
            border-radius: 0;
            display: none;
            box-shadow: 0 0 15px rgba(0, 255, 127, 0.3);
        }
        
        .time-info {
            display: grid;
            gap: 16px;
        }
        
        .time-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border: 1px solid #ff1493;
            border-radius: 0;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
        }
        
        .city-name {
            font-weight: 700;
            color: #00ff7f;
            font-size: 1.1rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00ff7f;
        }
        
        .time-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff1493;
            margin-bottom: 4px;
            text-shadow: 0 0 10px #ff1493;
        }
        
        .timezone-info {
            color: #ccc;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .error {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #ff6b6b;
            display: none;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
        
        .loading {
            text-align: center;
            color: #00ff7f;
            margin-top: 20px;
            display: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: loadingPulse 1s ease-in-out infinite;
        }
        
        @keyframes loadingPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .example {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 20, 147, 0.1);
            border: 1px solid #ff1493;
            font-size: 0.8rem;
            color: #ff1493;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TIMESYNC</h1>
        
        <form id="timezoneForm">
            <div class="form-group">
                <label for="cityA">From City</label>
                <input type="text" id="cityA" name="cityA" placeholder="NEW YORK, LONDON, TOKYO..." required>
            </div>
            
            <div class="form-group">
                <label for="cityB">To City</label>
                <input type="text" id="cityB" name="cityB" placeholder="LOS ANGELES, PARIS, SYDNEY..." required>
            </div>
            
            <div class="form-group">
                <label for="time">Time (Optional)</label>
                <input type="time" id="time" name="time">
            </div>
            
            <button type="submit" id="convertBtn">CONVERT TIMEZONE</button>
        </form>
        
        <div class="loading" id="loading">CONVERTING TIMEZONE...</div>
        
        <div class="result" id="result">
            <div class="time-info">
                <div class="time-box">
                    <div class="city-name" id="cityAName"></div>
                    <div class="time-display" id="timeA"></div>
                    <div class="timezone-info" id="timezoneA"></div>
                </div>
                <div class="time-box">
                    <div class="city-name" id="cityBName"></div>
                    <div class="time-display" id="timeB"></div>
                    <div class="timezone-info" id="timezoneB"></div>
                </div>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="example">
            <strong>EXAMPLES:</strong> TRY "NEW YORK", "LONDON", "TOKYO"
        </div>
    </div>

    <script>
        document.getElementById('timezoneForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cityA = document.getElementById('cityA').value.trim();
            const cityB = document.getElementById('cityB').value.trim();
            const time = document.getElementById('time').value.trim();
            
            if (!cityA || !cityB) {
                showError('Please enter both cities');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('convertBtn').disabled = true;
            
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city_a: cityA, city_b: cityB, time: time })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data);
                } else {
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('convertBtn').disabled = false;
            }
        });
        
        function showResult(data) {
            document.getElementById('cityAName').textContent = data.city_a.toUpperCase();
            document.getElementById('cityBName').textContent = data.city_b.toUpperCase();
            document.getElementById('timeA').textContent = data.time_a.split(' ').slice(1, 2).join(' ');
            document.getElementById('timeB').textContent = data.time_b.split(' ').slice(1, 2).join(' ');
            document.getElementById('timezoneA').textContent = data.timezone_a + ' • ' + data.time_a.split(' ')[0];
            document.getElementById('timezoneB').textContent = data.timezone_b + ' • ' + data.time_b.split(' ')[0];
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
