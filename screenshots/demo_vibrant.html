<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 WorldClock - Vibrant Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3);
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 0 80px rgba(255, 107, 107, 0.3);
            border: 3px solid #fff;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s linear infinite;
        }
        
        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        
        .form-group {
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 800;
            color: #2c3e50;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        input {
            width: 100%;
            padding: 18px 24px;
            border: 3px solid #ff6b6b;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #fff, #f8f9fa);
            color: #2c3e50;
        }
        
        input:focus {
            outline: none;
            border-color: #4ecdc4;
            background: #fff;
            box-shadow: 0 0 20px rgba(76, 205, 196, 0.5);
            transform: scale(1.02);
        }
        
        input::placeholder {
            color: #7f8c8d;
            font-weight: 500;
        }
        
        button {
            width: 100%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            position: relative;
            z-index: 1;
        }
        
        button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 30px rgba(255, 107, 107, 0.6);
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
        }
        
        button:active {
            transform: translateY(-2px) scale(1.01);
        }
        
        button:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 32px;
            padding: 24px;
            background: linear-gradient(135deg, #96ceb4, #feca57);
            border-radius: 20px;
            border: 3px solid #fff;
            box-shadow: 0 10px 25px rgba(150, 206, 180, 0.4);
            display: none;
            position: relative;
            z-index: 1;
        }
        
        .time-info {
            display: grid;
            gap: 16px;
        }
        
        .time-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 24px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #fff;
            transform: rotate(-1deg);
            transition: transform 0.3s ease;
        }
        
        .time-box:nth-child(2) {
            transform: rotate(1deg);
        }
        
        .time-box:hover {
            transform: rotate(0deg) scale(1.02);
        }
        
        .city-name {
            font-weight: 900;
            color: #e74c3c;
            font-size: 1.3rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .time-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #2c3e50;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .timezone-info {
            color: #7f8c8d;
            font-size: 1rem;
            font-weight: 700;
        }
        
        .error {
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 15px;
            color: white;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
            display: none;
            position: relative;
            z-index: 1;
        }
        
        .loading {
            text-align: center;
            color: #2c3e50;
            margin-top: 20px;
            display: none;
            font-weight: 700;
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }
        
        .example {
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #ff9ff3, #feca57);
            border-radius: 15px;
            font-size: 1rem;
            color: #2c3e50;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 159, 243, 0.3);
            position: relative;
            z-index: 1;
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
        
        .emoji-float {
            position: fixed;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="emoji-float" style="top: 10%; left: 10%;">🌍</div>
    <div class="emoji-float" style="top: 20%; right: 15%; animation-delay: -1s;">⏰</div>
    <div class="emoji-float" style="bottom: 30%; left: 5%; animation-delay: -2s;">🌟</div>
    <div class="emoji-float" style="bottom: 10%; right: 10%; animation-delay: -3s;">✈️</div>
    
    <div class="container">
        <h1>🌈 WorldClock</h1>
        
        <form id="timezoneForm">
            <div class="form-group">
                <label for="cityA">🏙️ From City</label>
                <input type="text" id="cityA" name="cityA" placeholder="New York, London, Tokyo..." required>
            </div>
            
            <div class="form-group">
                <label for="cityB">🌆 To City</label>
                <input type="text" id="cityB" name="cityB" placeholder="Los Angeles, Paris, Sydney..." required>
            </div>
            
            <div class="form-group">
                <label for="time">⏱️ Time (Optional)</label>
                <input type="time" id="time" name="time">
            </div>
            
            <button type="submit" id="convertBtn">🚀 Convert Timezone</button>
        </form>
        
        <div class="loading" id="loading">🌍 Converting timezone... ✨</div>
        
        <div class="result" id="result">
            <div class="time-info">
                <div class="time-box">
                    <div class="city-name" id="cityAName"></div>
                    <div class="time-display" id="timeA"></div>
                    <div class="timezone-info" id="timezoneA"></div>
                </div>
                <div class="time-box">
                    <div class="city-name" id="cityBName"></div>
                    <div class="time-display" id="timeB"></div>
                    <div class="timezone-info" id="timezoneB"></div>
                </div>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="example">
            <strong>🎯 Try these:</strong> "New York", "London", "Tokyo", "Sydney" for magical results! ✨
        </div>
    </div>

    <script>
        document.getElementById('timezoneForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cityA = document.getElementById('cityA').value.trim();
            const cityB = document.getElementById('cityB').value.trim();
            const time = document.getElementById('time').value.trim();
            
            if (!cityA || !cityB) {
                showError('Please enter both cities! 🏙️');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('convertBtn').disabled = true;
            
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city_a: cityA, city_b: cityB, time: time })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data);
                } else {
                    showError(data.error || 'An magical error occurred! 🎭');
                }
            } catch (error) {
                showError('Network error: ' + error.message + ' 🌐');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('convertBtn').disabled = false;
            }
        });
        
        function showResult(data) {
            document.getElementById('cityAName').textContent = '🏙️ ' + data.city_a;
            document.getElementById('cityBName').textContent = '🌆 ' + data.city_b;
            document.getElementById('timeA').textContent = data.time_a.split(' ').slice(1, 2).join(' ');
            document.getElementById('timeB').textContent = data.time_b.split(' ').slice(1, 2).join(' ');
            document.getElementById('timezoneA').textContent = data.timezone_a + ' • ' + data.time_a.split(' ')[0];
            document.getElementById('timezoneB').textContent = data.timezone_b + ' • ' + data.time_b.split(' ')[0];
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }
    </script>

    <script>
        window.addEventListener('load', function() {
            // Fill the form
            document.getElementById('cityA').value = 'New York';
            document.getElementById('cityB').value = 'London';
            
            // Show results after a delay
            setTimeout(function() {
                showResult({
                    city_a: "New York",
                    city_b: "London", 
                    time_a: "2025-06-21 16:45:38 EDT",
                    time_b: "2025-06-21 21:45:38 BST",
                    timezone_a: "America/New_York",
                    timezone_b: "Europe/London"
                });
            }, 1000);
        });
    </script>
    </body>
</html>
