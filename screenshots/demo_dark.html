<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 TimeZone - Dark Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 198, 120, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }
        
        .container {
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #ec4899, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e5e7eb;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transition: all 0.3s ease;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        input:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
            transform: translateY(-1px);
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 32px;
            padding: 24px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: none;
        }
        
        .time-info {
            display: grid;
            gap: 16px;
        }
        
        .time-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .city-name {
            font-weight: 700;
            color: #10b981;
            font-size: 1.1rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .time-display {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
            font-family: 'SF Mono', Monaco, monospace;
        }
        
        .timezone-info {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        .error {
            margin-top: 24px;
            padding: 16px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: none;
        }
        
        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 20px;
            display: none;
            font-weight: 500;
        }
        
        .example {
            margin-top: 24px;
            padding: 16px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 TimeZone</h1>
        
        <form id="timezoneForm">
            <div class="form-group">
                <label for="cityA">From City</label>
                <input type="text" id="cityA" name="cityA" placeholder="New York, London, Tokyo..." required>
            </div>
            
            <div class="form-group">
                <label for="cityB">To City</label>
                <input type="text" id="cityB" name="cityB" placeholder="Los Angeles, Paris, Sydney..." required>
            </div>
            
            <div class="form-group">
                <label for="time">Time (Optional)</label>
                <input type="time" id="time" name="time">
            </div>
            
            <button type="submit" id="convertBtn">Convert Timezone</button>
        </form>
        
        <div class="loading" id="loading">🌍 Converting timezone...</div>
        
        <div class="result" id="result">
            <div class="time-info">
                <div class="time-box">
                    <div class="city-name" id="cityAName"></div>
                    <div class="time-display" id="timeA"></div>
                    <div class="timezone-info" id="timezoneA"></div>
                </div>
                <div class="time-box">
                    <div class="city-name" id="cityBName"></div>
                    <div class="time-display" id="timeB"></div>
                    <div class="timezone-info" id="timezoneB"></div>
                </div>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="example">
            <strong>💡 Pro tip:</strong> Try major cities like "New York", "London", "Tokyo" for best results.
        </div>
    </div>

    <script>
        document.getElementById('timezoneForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cityA = document.getElementById('cityA').value.trim();
            const cityB = document.getElementById('cityB').value.trim();
            const time = document.getElementById('time').value.trim();
            
            if (!cityA || !cityB) {
                showError('Please enter both cities');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('convertBtn').disabled = true;
            
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city_a: cityA, city_b: cityB, time: time })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data);
                } else {
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('convertBtn').disabled = false;
            }
        });
        
        function showResult(data) {
            document.getElementById('cityAName').textContent = data.city_a;
            document.getElementById('cityBName').textContent = data.city_b;
            document.getElementById('timeA').textContent = data.time_a.split(' ').slice(1, 2).join(' ');
            document.getElementById('timeB').textContent = data.time_b.split(' ').slice(1, 2).join(' ');
            document.getElementById('timezoneA').textContent = data.timezone_a + ' • ' + data.time_a.split(' ')[0];
            document.getElementById('timezoneB').textContent = data.timezone_b + ' • ' + data.time_b.split(' ')[0];
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }
    </script>

    <script>
        window.addEventListener('load', function() {
            // Fill the form
            document.getElementById('cityA').value = 'New York';
            document.getElementById('cityB').value = 'London';
            
            // Show results after a delay
            setTimeout(function() {
                showResult({
                    city_a: "New York",
                    city_b: "London", 
                    time_a: "2025-06-21 16:45:38 EDT",
                    time_b: "2025-06-21 21:45:38 BST",
                    timezone_a: "America/New_York",
                    timezone_b: "Europe/London"
                });
            }, 1000);
        });
    </script>
    </body>
</html>
